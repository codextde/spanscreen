<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#090c14;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;inset:0;background:radial-gradient(55% 60% at 20% 0%,rgba(46,107,255,.45),transparent 70%),radial-gradient(45% 55% at 95% 100%,rgba(91,230,207,.22),transparent 70%)}
h1{position:relative;font-weight:750;letter-spacing:-.03em;text-align:center;line-height:1.05}
h1 span{background:linear-gradient(90deg,#5b8cff,#3ba0ff 55%,#5be6cf);-webkit-background-clip:text;background-clip:text;color:transparent}
.device{position:relative;background:#1a1d24;box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.12)}
.device img{display:block;width:100%;height:100%;object-fit:cover}
</style></head><body><div class="glow"></div><h1 id="t"></h1><div class="device" id="d"><img id="i"></div>
<script>
const q=new URLSearchParams(location.search);const W=innerWidth,H=innerHeight;const ipad=q.get('kind')==='ipad';
const t=document.getElementById('t');t.innerHTML=q.get('title');
const head=ipad?H*.17:H*.22;t.style.fontSize=(ipad?H*.052:H*.075)+'px';t.style.marginTop=(ipad?H*.055:H*.06)+'px';
const sw=+q.get('sw'),sh=+q.get('sh');const availH=H-head-(ipad?H*.06:H*.07),availW=W*(ipad?.86:.84);
let s=Math.min(availW/sw,availH/sh);const w=sw*s,h=sh*s;const bez=ipad?H*.018:H*.022;
const d=document.getElementById('d');d.style.width=(w+bez*2)+'px';d.style.height=(h+bez*2)+'px';d.style.padding=bez+'px';d.style.marginTop=(ipad?H*.035:H*.04)+'px';
d.style.borderRadius=(ipad?H*.045:H*.11)+'px';const img=document.getElementById('i');img.style.borderRadius=(ipad?H*.03:H*.085)+'px';img.src=q.get('src');
</script></body></html>
