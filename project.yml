name: Spanscreen
options:
  bundleIdPrefix: de.codext
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: STSYBH724K
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  SpanscreenKit:
    path: Packages/SpanscreenKit
targets:
  SpanscreenMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Mac/Resources
        excludes: ["Info.plist"]
    dependencies:
      - package: SpanscreenKit
    settings:
      base:
        PRODUCT_NAME: Spanscreen
        PRODUCT_BUNDLE_IDENTIFIER: de.codext.spanscreen.mac
        INFOPLIST_FILE: Mac/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Sources/Spanscreen-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  SpanscreenIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Resources
        excludes: ["Info.plist"]
    dependencies:
      - package: SpanscreenKit
    settings:
      base:
        PRODUCT_NAME: Spanscreen
        PRODUCT_BUNDLE_IDENTIFIER: de.codext.spanscreen
        INFOPLIST_FILE: iOS/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
schemes:
  SpanscreenMac:
    build:
      targets:
        SpanscreenMac: all
    run:
      config: Debug
    archive:
      config: Release
  SpanscreenIOS:
    build:
      targets:
        SpanscreenIOS: all
    run:
      config: Debug
    archive:
      config: Release
